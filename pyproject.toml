[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemind-cli"
version = "0.1.0"
description = "Agentic AI powered codebase intelligence CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "fastapi[standard]>=0.115",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-java>=0.23",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "networkx>=3.0",
]



[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", ]

[project.scripts]
codemind = "codemind.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "src*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008"]

